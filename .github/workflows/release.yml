name: Release

on:
  push:
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sanity check build output
        run: |
          test -f main.js || { echo "FAIL: main.js not generated"; exit 1; }
          test -f manifest.json || { echo "FAIL: manifest.json missing"; exit 1; }
          if grep -q "sourceMappingURL=data:" main.js; then
            echo "WARN: inline sourcemap detected in main.js"
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG}"
          FILES="main.js manifest.json styles.css"
          gh release create "$TAG" $FILES \
            --title "Lumos ${VERSION}" \
            --generate-notes
